  { act: 'menu', icon: 'grid', tip: 'منو (Esc یا M)' },
  { act: 'prev', icon: 'chevR', tip: 'قبلی', dirIcon: true },
  { act: 'next', icon: 'chevL', tip: 'بعدی', dirIcon: true },
  '|',
  { act: 'edit', icon: 'pencil', tip: 'حالت ویرایش (E)', toggle: true },
  { act: 'saveHtml', icon: 'download', tip: 'ذخیره به‌صورت فایل HTML (Ctrl+S)' },
  { act: 'exportJson', icon: 'braces', tip: 'خروجی JSON' },
  { act: 'importJson', icon: 'upload', tip: 'ورود JSON' },
  { act: 'reset', icon: 'reset', tip: 'بازنشانی به نسخه اصلی' },
  '|',
  { act: 'print', icon: 'printer', tip: 'چاپ / PDF' },
  { act: 'fullscreen', icon: 'expand', tip: 'تمام‌صفحه (F)' },
  { act: 'notes', icon: 'notes', tip: 'یادداشت سخنران (N)', toggle: true },
  { act: 'presenter', icon: 'monitor', tip: 'نمای ارائه‌دهنده (P)' },
  { act: 'timer', icon: 'timer', tip: 'نمایش/پنهان تایمر (T)', toggle: true },
  { act: 'help', icon: 'help', tip: 'راهنمای کلیدها (?)' }
];
function buildToolbar() {
  $('#toolbar').innerHTML = TOOLS.map(t => t === '|' ? '<span class="tb-sep" aria-hidden="true"></span>'
    : `<button class="tb-btn" data-act="${t.act}" data-tip="${t.tip}" aria-label="${t.tip}"${t.toggle ? ' aria-pressed="false"' : ''}>${icon(t.icon)}</button>`).join('');
  updateArrowIcons();
  $('#editbar').innerHTML = `
    <span class="eb-msg">${icon('pencil')} حالت ویرایش</span>
    <span class="eb-status" id="eb-status">${restored ? 'نسخه ذخیره‌شده بازیابی شد' : 'ذخیره خودکار فعال'}</span>
    <button class="eb-btn" data-act="saveHtml">${icon('download')} ذخیره HTML</button>
    <button class="eb-btn primary" data-act="edit">${icon('check')} پایان ویرایش</button>`;
  setPressed('timer', ui.timerVisible);
}
function updateArrowIcons() {      // در حالت چپ‌به‌راست، فلش‌های قبلی/بعدی جابه‌جا می‌شوند
  const rtl = ui.arrows === 'rtl';
  const p = $('#toolbar [data-act="prev"]'), n = $('#toolbar [data-act="next"]');
  if (p) p.innerHTML = icon(rtl ? 'chevR' : 'chevL');
  if (n) n.innerHTML = icon(rtl ? 'chevL' : 'chevR');
}
function setPressed(act, on) {
  const b = $(`#toolbar [data-act="${act}"]`);
  if (b) b.setAttribute('aria-pressed', String(!!on));
}
function setStatus(txt) {
  const s = $('#eb-status');
  if (s) s.textContent = txt;
}
let toastT = 0;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
const helpEl = $('#help');
function buildHelp() {
  const nextK = ui.arrows === 'rtl' ? '←' : '→';
  const prevK = ui.arrows === 'rtl' ? '→' : '←';
  helpEl.innerHTML = `<div class="help">
    <h2>راهنمای ارائه <button class="tb-btn" data-act="help" aria-label="بستن راهنما">${icon('x')}</button></h2>
    <table>
      <tr><td><kbd>${nextK}</kbd> <kbd>Space</kbd> <kbd>↓</kbd> <kbd>PageDown</kbd></td><td>اسلاید بعد (در پایان هر بخش: زوم معکوس به منو)</td></tr>
      <tr><td><kbd>${prevK}</kbd> <kbd>Shift+Space</kbd> <kbd>↑</kbd> <kbd>PageUp</kbd></td><td>اسلاید قبل</td></tr>
      <tr><td><kbd>Esc</kbd> یا <kbd>M</kbd></td><td>بازگشت به منو با زوم معکوس</td></tr>
      <tr><td><kbd>۱</kbd> تا <kbd>۹</kbd> (در منو)</td><td>ورود مستقیم به بخش</td></tr>
      <tr><td><kbd>Home</kbd> / <kbd>End</kbd></td><td>جلد / آخرین اسلاید</td></tr>
      <tr><td><kbd>F</kbd></td><td>تمام‌صفحه؛ در کروم برای خروج Esc را نگه دارید. در فایرفاکس Esc از تمام‌صفحه خارج می‌شود، پس برای منو <kbd>M</kbd> را بزنید.</td></tr>
      <tr><td><kbd>N</kbd></td><td>یادداشت سخنران زیر همین صفحه</td></tr>
      <tr><td><kbd>P</kbd></td><td>نمای ارائه‌دهنده: پنجره جدا با تصویر زنده اسلاید، اسلاید بعد، متن سخنران و تایمر (برای لپ‌تاپ؛ پنجره اصلی روی پرده)</td></tr>
      <tr><td><kbd>T</kbd></td><td>نمایش یا پنهان کردن تایمر ۲۰ دقیقه‌ای</td></tr>
      <tr><td><kbd>E</kbd> / <kbd>Ctrl+S</kbd></td><td>حالت ویرایش / ذخیره به‌صورت فایل HTML</td></tr>
      <tr><td>کشیدن انگشت (موبایل)</td><td>${ui.arrows === 'rtl' ? 'به راست: بعدی، به چپ: قبلی' : 'به چپ: بعدی، به راست: قبلی'}</td></tr>
    </table>
    <div class="help-foot"><span>کلیدهای حرفی با صفحه‌کلید فارسی هم کار می‌کنند.</span>
      <button class="eb-btn" data-act="arrows">جهت کلیدهای چپ/راست: ${ui.arrows === 'rtl' ? 'راست‌به‌چپ (← بعدی)' : 'چپ‌به‌راست (→ بعدی)'}</button></div>
  </div>`;
}
let helpOpener = null;
function toggleHelp(force) {
  const open = force != null ? force : !helpEl.classList.contains('open');
  const was = helpEl.classList.contains('open');
  helpEl.classList.toggle('open', open);
  ['#viewport', '#toolbar', '#editbar', '#timer', '#notes'].forEach(sel => { $(sel).inert = open; });   // فوکوس داخل راهنما می‌ماند
  if (open && !was) {
    helpOpener = document.activeElement;
    const b = $('button', helpEl);
    if (b) b.focus();
  } else if (!open && was) {
    if (helpOpener && helpOpener.isConnected && typeof helpOpener.focus === 'function') helpOpener.focus({ preventScroll: true });
    helpOpener = null;
  }
}

function toggleTimer(force) {
  ui.timerVisible = force != null ? force : timerEl.hidden;
  timerEl.hidden = !ui.timerVisible;
  setPressed('timer', ui.timerVisible);
  saveUi();
}
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    const req = document.documentElement.requestFullscreen;
    if (!req) { toast('تمام‌صفحه در این مرورگر پشتیبانی نمی‌شود.'); return; }
    document.documentElement.requestFullscreen().then(() => {
      if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['Escape']).catch(() => {});
      else toast('در این مرورگر Esc از تمام‌صفحه خارج می‌شود؛ برای بازگشت به منو کلید M را بزنید.');
    }).catch(() => toast('مرورگر اجازه تمام‌صفحه نداد.'));
  } else if (document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}
document.addEventListener('fullscreenchange', () => {
  const on = !!document.fullscreenElement;
  const b = $('#toolbar [data-act="fullscreen"]');
  if (b) b.innerHTML = icon(on ? 'shrink' : 'expand');
  if (!on && navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
});

const ACTIONS = {
  menu: goMenu, prev, next,
  edit: () => setEditing(!editing),
  saveHtml, exportJson, importJson, reset: resetDeck,
  print: () => { if (saveTimer) saveLocal(); window.print(); },
  fullscreen: toggleFullscreen,
  notes: () => toggleNotes(),
  timer: () => toggleTimer(),
  timerToggle: () => (timer.running ? pauseTimer() : startTimer()),
  timerReset: resetTimer,
  presenter: openPresenter,
  help: () => toggleHelp(),
  arrows: () => {
    ui.arrows = ui.arrows === 'rtl' ? 'ltr' : 'rtl';
    saveUi(); buildHelp(); updateCoverHint(); updateArrowIcons();
    const b = $('[data-act="arrows"]', helpEl); if (b) b.focus();
  }
};
document.addEventListener('click', e => {
  const btn = e.target.closest ? e.target.closest('[data-act]') : null;
  if (btn && ACTIONS[btn.dataset.act]) {
    ACTIONS[btn.dataset.act]();
    if (e.detail > 0 && btn.isConnected) btn.blur();     // تا Space بعدی دکمه را دوباره فشار ندهد
    return;
  }
  if (e.target === helpEl) { toggleHelp(false); return; }
  const tile = e.target.closest ? e.target.closest('.tile') : null;
  if (tile && nav.key === 'menu') {
    if (editing && e.target.closest('[data-path]')) return;
    zoomIn(+tile.dataset.si, 0);
  }
});
stage.addEventListener('keydown', e => {
  const tile = e.target.closest ? e.target.closest('.tile') : null;
  if (!tile || e.target !== tile) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); zoomIn(+tile.dataset.si, 0); }
});

/* ═══ ۱۶. صفحه‌کلید (مستقل از زبان صفحه‌کلید با e.code) ═══ */
function onKey(e) {
  if (e.defaultPrevented) return;
  const tgt = e.target;
  const ed = tgt && tgt.closest ? tgt.closest('[contenteditable]') : null;
  if (ed && ed.isContentEditable) {
    if (e.key === 'Escape') { e.preventDefault(); ed.blur(); }
    else if (e.key === 'Enter' && !ed.hasAttribute('data-multiline')) { e.preventDefault(); ed.blur(); }
    else if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') { e.preventDefault(); saveHtml(); }
    return;
  }
  if (tgt && tgt.closest && tgt.closest('input, textarea, select')) return;
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS') { e.preventDefault(); saveHtml(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (helpEl.classList.contains('open')) {
    if (e.key === 'Escape' || e.code === 'Slash' || e.code === 'KeyH') { e.preventDefault(); toggleHelp(false); }
    else if (e.key === 'Tab') {
      const f = $$('button', helpEl);
      const i = f.indexOf(document.activeElement);
      e.preventDefault();
      f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
    }
    return;
  }
  const onButton = tgt && tgt.closest && tgt.closest('button, [role="button"]');
  const nextKey = ui.arrows === 'rtl' ? 'ArrowLeft' : 'ArrowRight';
  const prevKey = ui.arrows === 'rtl' ? 'ArrowRight' : 'ArrowLeft';
  let handled = true;
  switch (e.key) {
    case nextKey: case 'ArrowDown': case 'PageDown': next(); break;
    case prevKey: case 'ArrowUp': case 'PageUp': prev(); break;
    case ' ': case 'Spacebar':
      if (onButton) { handled = false; break; }
      e.shiftKey ? prev() : next(); break;
    case 'Enter':
      if (onButton) { handled = false; break; }
      if (nav.key === 'cover' || nav.key === 'menu') next(); else handled = false;
      break;
    case 'Escape': goMenu(); break;
    case 'Home': goTo('cover'); break;
    case 'End': goTo(order[order.length - 1]); break;
    default: handled = false;
  }
  if (!handled) {
    handled = true;
    switch (e.code) {
      case 'KeyF': toggleFullscreen(); break;
      case 'KeyN': toggleNotes(); break;
      case 'KeyP': openPresenter(); break;
      case 'KeyT': toggleTimer(); break;
      case 'KeyE': setEditing(!editing); break;
      case 'KeyM': goMenu(); break;
      case 'KeyH': case 'Slash': toggleHelp(); break;
      default: {
        const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
        if (m && nav.key === 'menu' && +m[1] <= state.sections.length) zoomIn(+m[1] - 1, 0);
        else handled = false;
      }
    }
  }
  if (handled) e.preventDefault();
}
document.addEventListener('keydown', onKey);

/* کشیدن انگشت در موبایل (راست‌به‌چپ: کشیدن به راست = بعدی) */
let touch0 = null;
const viewportEl = $('#viewport');
viewportEl.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) { touch0 = null; return; }
  for (let n = e.target; n && n !== viewportEl; n = n.parentElement) {   // داخل ناحیه‌ای که افقی اسکرول می‌شود، کشیدن = اسکرول
    if (n.scrollWidth > n.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) { touch0 = null; return; }
  }
  const t = e.touches[0];
  touch0 = { x: t.clientX, y: t.clientY, time: performance.now() };
}, { passive: true });
viewportEl.addEventListener('touchend', e => {
  if (!touch0 || editing) { touch0 = null; return; }
  const t = e.changedTouches[0];
  const dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  const quick = performance.now() - touch0.time < 800;
  touch0 = null;
  if (quick && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    const forward = ui.arrows === 'rtl' ? dx > 0 : dx < 0;
    forward ? next() : prev();
  }
}, { passive: true });

/* پنهان شدن خودکار نوار ابزار هنگام ارائه */
let idleT = 0;
function wake() {
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 2600);
}
['mousemove', 'mousedown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));

addEventListener('pagehide', () => {
  if (saveTimer) saveLocal();
  try { if (pres && !pres.closed) pres.close(); } catch (e) { /* نادیده */ }
});
addEventListener('beforeprint', () => { if (saveTimer) saveLocal(); });

/* ═══ ۱۷. راه‌اندازی ═══ */
function init() {
  fit();
  buildToolbar();
  buildHelp();
  buildTimer();
  try { buildDeck(); } catch (err) {                 // ذخیره محلیِ خراب: برگشت به نسخه اصلی
    storageDel(STORE_KEY);
    state = clone(DATA);
    buildDeck();
    setTimeout(() => toast('نسخه ذخیره‌شده خراب بود؛ نسخه اصلی بارگذاری شد.'), 50);
  }
  let fromHash = '';
  try { fromHash = decodeURIComponent((location.hash || '').slice(1)); } catch (e) { /* hash نامعتبر */ }
  const start = slideEls[fromHash] ? fromHash : 'cover';
  if (start !== 'cover' && start !== 'menu') {
    const p = parseKey(start);
    for (let i = 0; i < p.si; i++) nav.visited.add(i);
  }
  show(start, { noReveal: false });
  wake();
  if (restored) toast('آخرین تغییرات ذخیره‌شده بازیابی شد.');
}
init();
</script>
</body>
